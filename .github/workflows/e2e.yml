name: 'E2E'

on:
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/lib/**'
      - 'packages/runtime/**'
      - 'tests/e2e/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/e2e.yml'

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bunx playwright --version)" >> $GITHUB_OUTPUT
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium & dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium --with-deps
      - name: Run E2E tests
        run: cd packages/e2e && bun run test:e2e
