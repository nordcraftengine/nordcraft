name: SSR Benchmark

on:
  pull_request:
    paths-ignore:
      - '.vscode/**'
      - '**/*/README.md'

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies (head)
        run: bun install --frozen-lockfile

      - name: Build packages (head)
        run: bun run build

      - name: Benchmark PR head
        run: bun bin/ssrBenchmark.ts --samples=20 --warmup=5 --iterations=1 --output=/tmp/ssr-benchmark-head.json

      - name: Create worktree for base
        run: git worktree add /tmp/nordcraft-base ${{ github.event.pull_request.base.sha }}

      - name: Install dependencies (base)
        run: bun install --frozen-lockfile
        working-directory: /tmp/nordcraft-base

      - name: Build packages (base)
        run: bun run build
        working-directory: /tmp/nordcraft-base

      - name: Copy benchmark script to base worktree
        run: |
          mkdir -p /tmp/nordcraft-base/bin
          cp bin/ssrBenchmark.ts /tmp/nordcraft-base/bin/ssrBenchmark.ts

      - name: Benchmark PR base
        run: bun bin/ssrBenchmark.ts --samples=20 --warmup=5 --iterations=1 --output=/tmp/ssr-benchmark-base.json
        working-directory: /tmp/nordcraft-base

      - name: Compare benchmark results
        id: compare
        continue-on-error: true
        run: |
          bun bin/compareBenchmarks.ts --base=/tmp/ssr-benchmark-base.json --head=/tmp/ssr-benchmark-head.json --max-regression-percent=5 --max-regression-ms=1.0 --fail-on-regression=false > /tmp/ssr-benchmark-report.md
          tee -a "$GITHUB_STEP_SUMMARY" < /tmp/ssr-benchmark-report.md

      - name: Check benchmark threshold
        id: threshold
        continue-on-error: true
        run: |
          bun bin/compareBenchmarks.ts --base=/tmp/ssr-benchmark-base.json --head=/tmp/ssr-benchmark-head.json --max-regression-percent=5 --max-regression-ms=1.0 > /tmp/ssr-benchmark-threshold.md

      - name: Ensure benchmark report exists
        if: always()
        run: |
          if [ ! -f /tmp/ssr-benchmark-report.md ]; then
            printf '## SSR Benchmark Comparison\n\n:warning: Benchmark comparison report could not be generated. Check previous workflow logs.\n' > /tmp/ssr-benchmark-report.md
          fi

      - name: Comment on pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const reportPath = '/tmp/ssr-benchmark-report.md'
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : '## SSR Benchmark Comparison\n\n:warning: Benchmark comparison report could not be generated. Check previous workflow logs.\n'
            const marker = '<!-- ssr-benchmark-report -->'
            const body = `${marker}\n${report}`

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })

            const existing = comments.find((comment) => comment.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            /tmp/ssr-benchmark-*.json
            /tmp/ssr-benchmark-*.md

      - name: Cleanup base worktree
        if: always()
        run: git worktree remove /tmp/nordcraft-base --force

      - name: Fail on benchmark regression
        if: steps.threshold.outcome == 'failure'
        run: exit 1
