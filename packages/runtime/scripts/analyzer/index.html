<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf8">
    <title>Nordcraft Runtime - Bundle Size Analyzer</title>
    <link rel="stylesheet" href="index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <div id="dragTarget"></div>
    <div id="startPanel">
      <section>
        <div class="center">
          <div id="logo">
            <h1>Nordcraft</h1>
            <blockquote>Bundle Size Analyzer</blockquote>
          </div>
        </div>
        <p>Loading bundle analysis...</p>
        <p class="center">
          <button id="importButton">Import another metafile...</button>
        </p>
        <noscript>
          <p class="noscript">
            &#x274C; This page requires JavaScript.
            Please enable JavaScript and reload the page.
          </p>
        </noscript>
      </section>
    </div>
    <div id="resultsPanel">
      <div id="summaryPanel"></div>
      <div id="warningsPanel"></div>
      <div id="settingsPanel">
        <div class="chartSwitcher">
          <span><a id="useTreemap" href="javascript:void 0">Treemap Chart</a></span>
          <span><a id="useSunburst" href="javascript:void 0">Sunburst Chart</a></span>
          <span><a id="useFlame" href="javascript:void 0">Flame Chart</a></span>
        </div>
      </div>
      <div id="chartPanel"></div>
    </div>
    <script src="index.js"></script>
    <script>
      fetch('/metafile.json')
        .then(function (res) {
          return res.text()
        })
        .then(function (json) {
          if (window.loadMetafile) {
            window.loadMetafile(json)
          }
        })
        .catch(function (err) {
          console.error('Failed to load metafile:', err)
        })
    </script>
  </body>
</html>
